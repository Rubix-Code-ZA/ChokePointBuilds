    <style>
      /* Platform feel, from day one (design.md §4.2): no tap delay, no rubber
         band, no text selection, no white flash, safe areas respected. */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #141518;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      #app {
        position: fixed;
        inset: 0;
        padding-top: var(--safe-area-inset-top, env(safe-area-inset-top));
        padding-right: var(--safe-area-inset-right, env(safe-area-inset-right));
        padding-bottom: var(--safe-area-inset-bottom, env(safe-area-inset-bottom));
        padding-left: var(--safe-area-inset-left, env(safe-area-inset-left));
        box-sizing: border-box;
      }
      /* The canvas is sized to #stage, which is #app's content box: the
         safe-area padding above shrinks it rather than pushing it off screen. */
      #stage {
        position: relative;
        width: 100%;
        height: 100%;
      }
      #stage canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
    </style>
